version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: organizer-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=auto
      - ENABLE_CLEANUP_WORKER=true
      - TEMP_FILE_TTL_MINUTES=15
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: organizer-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  excel-addin:
    build:
      context: ./excel-addin
      dockerfile: Dockerfile
    container_name: organizer-excel-addin
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
